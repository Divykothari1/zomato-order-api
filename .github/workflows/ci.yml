name: Zomato Order API - CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub se code uthao
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Docker Image build karo
      - name: Build Docker Image
        run: docker build -t zomato-order-api .

      # 3. Container chala kar test karo (CI Check)
      - name: Run Container & Test Health Endpoint
        run: |
          docker run -d -p 8000:8000 --name test-container zomato-order-api
          sleep 5
          curl --fail http://localhost:8000/ || exit 1
          docker stop test-container

      # 4. AWS Credentials configure karo (GitHub Secrets se)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # 5. AWS ECR mein Login karo
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Docker Image ko Tag karke seedha AWS ECR mein Push kar do!
      - name: Push Docker Image to AWS ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: zomato-order-api
          IMAGE_TAG: latest
        run: |
          docker tag zomato-order-api:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG